# MusePack — Beer Tracker
# This is the entry point. A user points their Muse at this file's URL;
# the Muse reads this file first and follows `files:` links only when a
# step needs them (progressive disclosure).
# Format status: v0.2 PILOT — built 2026-11-17, revised the same day from
# two install tests (the creator's own Muse, and a clean-room install on
# another person's Muse). V0.2 changes: (1) the space spec now carries an
# exact surface inventory (tabs, in order) with a matching verify check
# and a reference screenshot — two v0.1 installs improvised different tab
# bars because v0.1 never pinned them; (2) personal-data scrub: a
# question whose answer is personal to the user carries NO default — the
# creator's own value must never ship in a pack, not even as a default;
# (3) data-only manifest: the v0.1 imperative instruction block is gone —
# the install bootstrap now lives in the universal MusePack Installer
# skill, so this file reads as data, not as instructions from the web.

# ---------------------------------------------------------------------------
# DATA-ONLY MANIFEST. This file intentionally contains NO instructions
# for Muse. It is a declarative description of the pack: what it
# contains, what the recipient may customize, and how an install is
# verified. The install procedure lives in the separate, universal
# MusePack Installer skill, which the user installs once (from
# MusePacks.ai) and which treats this file as data. The user's prompt
# is simply: "Install this MusePack: <this file's URL>".
# ---------------------------------------------------------------------------

name: beer-tracker
version: 0.6.0
format: musepack
installer_skill: musepack-installer   # the universal installer skill this pack is installed with
title: "Beer Tracker"
description: "A mobile-app-style beer journal: log a beer and it is looked up and broken down into its components (brewery, style, ABV, IBU, hops, malts, flavor notes, balance scores, with sources), rate what you liked and didn't, record where you tried it, and the app connects the dots across your taste and suggests real beers to try next."
author: "Marcelo Lewin"
license: share-freely

# ---------------------------------------------------------------------------
# Files in this pack. All links are relative to this file's location.
# ---------------------------------------------------------------------------
files:
  space_header:  ./space/SPACE.yaml      # light header for the space
  space_spec:    ./space/SPACE.md        # full space concept, layout, and behavior
  space_actions: ./space/actions.json    # every published action + its request schema
  space_seed:    ./space/seed.json       # the 8 taste questions (generic content only, no answers)
  companion_skills:
    - ./skills/beer-taste/SKILL.md       # how Muse talks about taste, logs, and suggestions
  rules:         ./rules.yaml            # standing behavior rules (generic, with placeholders)
  schedules:     ./schedules.yaml        # scheduled jobs this pack can set up (all opt-in)
  side_chats:    ./side-chats.yaml       # starter side chats (Beer Chat)
  capabilities:  ./capabilities.yaml     # built-in Muse capabilities this pack needs (format doc §9)
  connectors:    ./connectors.yaml       # account connectors this pack needs — none (empty list)
  changelog:     ./CHANGELOG.md          # version history, in human words
  assets_note:   ./assets/README.md      # what image files ship, and why
  surface_reference: ./assets/tab-bar-reference.png  # the exact tab bar the built space must match (see verify)

# ---------------------------------------------------------------------------
# What the receiving Muse needs. Credentials never travel with a pack;
# the receiving user connects their own accounts, and only if they agree.
# ---------------------------------------------------------------------------
# Integrity: SHA-256 of every file the pack ships (the manifest itself is
# not hashed — it is the file a future signature will cover; see format
# doc §12.6). The installer's Quality & Safety gate recomputes these
# after download; any mismatch is a structural failure and stops the
# install. Asset files sit next to their linked README and are fetched
# with the folder.
