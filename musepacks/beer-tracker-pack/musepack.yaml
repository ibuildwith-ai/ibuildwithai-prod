    capabilities.yaml: b411fb8043b26d8c7709b208112977ee01cb5348c812f30a411f557cb215c4c8
    connectors.yaml: ed5c0aae9cd551dffa2638e974726b67ed27e047673a55d36991078345fd18ce
    rules.yaml: bdf66176284644be3a623876fab464b564f4d8459b0114323579a72582b7681e
