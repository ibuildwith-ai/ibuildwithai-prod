requires:
  plan: any
  public_web_read: true   # lookupbeer, generatetastesummary, generatesuggestions all read the public web
  # This pack needs no account connectors. Its one built-in capability
  # is declared in capabilities.yaml (format doc §9) — optional; the
  # space works with manual venue entry.

contents:
  spaces: [beer-tracker]
  skills: [beer-taste]
  schedules: []           # none installed by default; see schedules.yaml
  side_chats: [beer-chat] # starter side chats; see side-chats.yaml
  capabilities: [places]  # optional; declared in capabilities.yaml
  connectors: []          # none; connectors.yaml ships as an empty list

# ---------------------------------------------------------------------------
# Questions. THE STANDARD (same as every MusePack):
# - The pack creator decides what is asked. There is no default set.
# - A setting that appears here is asked, using this prompt, these options,
#   and this default.
# - PERSONAL-DATA RULE: a default may only ever be a design value (a count,
#   a mode, a color) — never the creator's personal data. A question whose
#   answer is personal to each user (their location, name, accounts, or
#   content) carries NO default at all: the creator's own value must not
#   appear anywhere in the pack, and the receiving Muse must ask without
#   presenting any suggested value for it.
# - A setting that does NOT appear here is fixed: the receiving Muse builds
#   it exactly as specified in the linked files and does not ask about it.
# - Answers replace the matching placeholder everywhere in the pack.
# - `required: true` means there is no safe default for another person
#   (e.g. their own home area); the Muse must ask even in "exact copy" mode.
# ---------------------------------------------------------------------------
questions:
  - key: home_area
    prompt: "What city or area do you drink in most? Place searches for where you tried a beer will be biased to that area."
    type: text
    # NO DEFAULT — personal to each user. The creator's own area must never
    # ship in this pack, not even as a default (v0.1 shipped one; removed
    # in v0.2 after a clean-room install surfaced it to another user).
    required: true
    affects: ["space.searchplaces.bias", "rules"]

  - key: venue_lookup
    prompt: "When you log where you tried a beer, should the app look the place up (real address, map link, you confirm the right one), or will you type venue details in manually?"
    type: choice
    options: ["lookup_and_confirm", "manual_only"]
    default: "lookup_and_confirm"
    required: false
    affects: ["space.where_tried", "capabilities.places"]

  - key: suggestions_count
    prompt: "How many suggestions should the For You tab generate at a time?"
    type: choice
    options: [4, 6, 8]
    default: 6
    required: false
    affects: ["space.for_you"]

# Deliberately NOT questions in this pack (creator's choice — fixed):
# - The mobile-app design itself: dark, amber-accented, bottom tab bar with
#   a raised center Log button, bottom sheets, cards — it must feel like a
#   phone app, not a website
# - The verdict scale (love / like / ok / dislike), star rating, and
#   per-flavor thumbs up/down
# - The component breakdown fields and the rule that every looked-up value
#   carries a source, and no address or beer fact is ever invented
# - The 8 taste-profile questions themselves (their ANSWERS are the user's
#   own and are never shipped)
# - The insights method: affinities computed from the user's own verdicts

# ---------------------------------------------------------------------------
# Install order (data for the MusePack Installer skill, which holds the
# actual procedure).
# ---------------------------------------------------------------------------
install_order: [questions, space, seed, companion_skills, rules, schedules]

# ---------------------------------------------------------------------------
# Verification. A pack is not "installed" until these pass and are reported.
# ---------------------------------------------------------------------------
verify:
  - "A new space exists with a slug that did not exist before the install, and the user's pre-existing spaces are unchanged"
  - "SURFACE CHECK: the built space's tab bar is exactly these 7, in this order — Home, Journal, Insights, Log (raised center button), For You, Places, Taste — matching files.surface_reference; no tab missing, no extra tab, none renamed"
  - "gettastequestions returns exactly 8 questions, every one unanswered"
  - "listbeers returns no beers and gethome shows a total of 0 — the space starts empty, no creator data came with the pack"
  - "lookupbeer for 'Sierra Nevada Pale Ale' returns a breakdown with brewery, style, ABV, IBU, hops and malts, and at least one source link (this lookup saves nothing)"
  - "If venue_lookup is lookup_and_confirm: searchplaces for a brewery near {{home_area}} returns at least one candidate with a full address; the user, not the app, picks the venue on a real log"
  - "Logging a test beer, then calling getinsights, produces flavor/style affinities from that test log; the test beer is then deleted and listbeers is empty again"
  - "A side chat titled 'Beer Chat' exists, opened with the focus brief from files.side_chats (placeholders substituted), associated with this pack's space and the beer-taste skill"

# Test-install rule (data for the installer skill): if a space with this pack's
# slug already exists — for example the creator testing their own pack on
# their own Muse — build the test copy under a different slug and name
# (beer-tracker-test / 'Beer Tracker (Test)') next to the original, never
# over it. A test copy can be deleted afterwards; the original is not
# touched.
test_install:
  slug_suffix: "-test"
  name_suffix: " (Test)"
